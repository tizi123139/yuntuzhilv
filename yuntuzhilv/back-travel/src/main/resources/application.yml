server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/travel_planner?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 10000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.travel.backtravel.entity

jwt:
  secret: travel-planner-jwt-secret-key-2024-must-be-at-least-256-bits-long
  expiration: 86400000
  refresh-expiration: 604800000

langchain:
  qwen:
    api-key: your-qwen-api-key
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  chroma:
    host: localhost
    port: 8000
    collection-name: travel-knowledge

logging:
  level:
    com.travel.backtravel: DEBUG
    org.mybatis: DEBUG
